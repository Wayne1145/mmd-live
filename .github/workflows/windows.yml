name: Windows build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - run: dotnet restore MmdLive.slnx --locked-mode
      - run: dotnet build MmdLive.slnx --no-restore -c Release
      - run: dotnet run --no-build -c Release --project tests/MmdLive.Checks -- contracts assets/studio/StudioPilot.pmx
